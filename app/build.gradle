plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maru.musiclive'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maru.musiclive.ocr'
        minSdk 26
        targetSdk 36
        versionCode 3025
        versionName '3.2.5'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-ultra26-debug'
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // The real bundled song and LRC are committed directly under
    // app/src/main/res/raw. No copy/generation task is used, so resource
    // merging sees the same files in local and GitHub Actions builds.
    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
