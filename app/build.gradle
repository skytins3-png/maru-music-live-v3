plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maru.musiclive'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maru.musiclive.english'
        // Optional standalone MARU ONE build, safe to install beside an already
        // signed V3.2.23 MARU RADIO EN app. No private data is copied.
        if (project.hasProperty('maruStandalone')) {
            applicationId 'com.maru.musiclive.one'
        }
        // New side-by-side auto-library scanner build. Keep every already
        // installed MARU package and its private database untouched.
        if (project.hasProperty('maruAutoScan')) {
            applicationId 'com.maru.musiclive.autoscan.v20261124'
        }
        // Full-hub edition is a distinct package. Never overwrite earlier
        // radio, scanner or standalone apps or silently migrate app-private files.
        if (project.hasProperty('maruFullHub')) {
            applicationId 'com.maru.musiclive.fullhub.v20261124'
        }
        // Distinct BIGO-ready build, separate from every previous MARU install.
        // Cannot silently launch BIGO's live room or hijack its microphone.
        if (project.hasProperty('maruBigoReady')) {
            applicationId 'com.maru.musiclive.bigo.ready20261124'
        }
        // Native Android encoder; no PC OBS, no Accessibility automation.
        // Different package protects every previously installed MARU app.
        if (project.hasProperty('maruDirectRtmp')) {
            applicationId 'com.maru.musiclive.directrtmp.v20261124'
        }
        // Safety fallback for Android INSTALL_FAILED_UPDATE_INCOMPATIBLE:
        // new unique package, no overwrite and no private-data migration.
        // Cannot upgrade differently signed existing MARU apps.
        if (project.hasProperty('maruInstallRepair')) {
            applicationId 'com.maru.musiclive.trilang.safe20261101'
        }
        // Unique package because previous sideload builds may use a different
        // signing certificate. Existing MARU apps and data are not touched.
        if (project.hasProperty('maruDjVoiceSelector')) {
            applicationId 'com.maru.musiclive.ahwanvoice.v20261101'
        }
        if (project.hasProperty('maruClipOnly')) {
            applicationId 'com.maru.musiclive.clips.v20261105'
        }
        buildConfigField 'boolean', 'AHWAN_CLIP_ONLY',
                project.hasProperty('maruClipOnly') ? 'true' : 'false'
        buildConfigField 'boolean', 'MARU_FULL_HUB',
                (project.hasProperty('maruFullHub') || project.hasProperty('maruBigoReady') || project.hasProperty('maruDirectRtmp')) ? 'true' : 'false'
        buildConfigField 'boolean', 'MARU_DIRECT_RTMP',
                project.hasProperty('maruDirectRtmp') ? 'true' : 'false'
        // Dedicated MARU voice-bridge APK installs beside earlier differently signed
        // MARU installations. No access to existing apps' saved private data.
        if (project.hasProperty('maruVoiceBridge')) {
            applicationId 'com.maru.musiclive.voicebridge.v20261105'
        }
        // Preview installs beside the previous MARU apps, never overwrites their data.
        if (project.hasProperty('maruLibraryPreview')) {
            applicationId 'com.maru.musiclive.librarypreview'
        }
        manifestPlaceholders = [
            maruRtmpEnabled: project.hasProperty('maruDirectRtmp') ? 'true' : 'false',
            maruAppLabel: project.hasProperty('maruClipOnly')
                ? 'MARU 아환 실제음성 연결'
                : project.hasProperty('maruVoiceBridge')
                ? 'MARU 아환 토크연결'
                : project.hasProperty('maruDjVoiceSelector')
                ? 'MARU 아환 음성선택'
                : project.hasProperty('maruInstallRepair')
                ? 'MARU 3언어 새설치'
                : project.hasProperty('maruLibraryPreview')
                ? 'MARU 노래 보관함 시험판'
                : project.hasProperty('maruDirectRtmp')
                ? 'MARU OBS없는 직접송출'
                : project.hasProperty('maruBigoReady')
                ? 'MARU BIGO 방송연결'
                : project.hasProperty('maruFullHub')
                ? 'MARU ONE 통합 조종실'
                : project.hasProperty('maruAutoScan')
                ? 'MARU 음악 자동등록'
                : project.hasProperty('maruStandalone')
                ? 'MARU 통합 라디오'
                : 'MARU RADIO EN'
        ]
        minSdk 26
        targetSdk 36
        // Galaxy S26 Ultra and current 64-bit Android devices.
        // Exclude x86/x86_64 and 32-bit OCR native libraries from the installer.
        // Keep on-device Korean/Chinese OCR models and original audio.
        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode 3044
        versionName '3.2.25'
        if (project.hasProperty('maruLibraryPreview')) {
            versionName '3.2.25-library-preview'
        }
        if (project.hasProperty('maruAutoScan')) {
            versionName '3.2.25-auto-scan'
        }
        if (project.hasProperty('maruFullHub')) {
            versionName '3.2.25-full-hub-20261124'
        }
        if (project.hasProperty('maruBigoReady')) {
            versionName '3.2.26-bigo-ready'
        }
        if (project.hasProperty('maruDirectRtmp')) {
            versionName '3.2.27-obs-free-rtmp'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-ultra26-debug'
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }

    // The real bundled song and LRC are committed directly under
    // app/src/main/res/raw. No copy/generation task is used, so resource
    // merging sees the same files in local and GitHub Actions builds.
    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
            if (project.hasProperty('maruDirectRtmp')) {
                java.srcDirs += ['src/rtmp/java']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    // A separate APK variant only: existing MARU packages stay dependency-free.
    if (project.hasProperty('maruDirectRtmp')) {
        implementation 'com.github.pedroSG94.RootEncoder:library:2.8.2'
    }
}
