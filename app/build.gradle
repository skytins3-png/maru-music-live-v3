plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maru.musiclive'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maru.musiclive.english'
        // Optional standalone MARU ONE build, safe to install beside an already
        // signed V3.2.23 MARU RADIO EN app. No private data is copied.
        if (project.hasProperty('maruStandalone')) {
            applicationId 'com.maru.musiclive.one'
        }
        manifestPlaceholders = [
            maruAppLabel: project.hasProperty('maruStandalone')
                ? 'MARU 통합 라디오'
                : 'MARU RADIO EN'
        ]
        minSdk 26
        targetSdk 36
        // Galaxy S26 Ultra and current 64-bit Android devices.
        // Exclude x86/x86_64 and 32-bit OCR native libraries from the installer.
        // Keep on-device Korean/Chinese OCR models and original audio.
        ndk {
            abiFilters 'arm64-v8a'
        }
        // The installed MARU ONE and the English edition are DIFFERENT app IDs.
        // Only MARU ONE receives the next update version. Never downgrade either.
        versionCode project.hasProperty('maruStandalone') ? 3044 : 3043
        versionName project.hasProperty('maruStandalone') ? '3.2.25' : '3.2.24'
    }

    signingConfigs {
        persistentMaruOne {
            // Release signing secrets belong to GitHub Actions secrets, never source.
            if (System.getenv('MARU_ONE_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MARU_ONE_KEYSTORE_PATH'))
                storePassword System.getenv('MARU_ONE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MARU_ONE_KEY_ALIAS')
                keyPassword System.getenv('MARU_ONE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-ultra26-debug'
        }
        release {
            // Untrusted local/CI test output uses an ephemeral debug key.
            // Public automatic updates REQUIRE the persistent GitHub-secret key.
            signingConfig (project.hasProperty('maruStandalone') &&
                    System.getenv('MARU_ONE_KEYSTORE_PATH'))
                    ? signingConfigs.persistentMaruOne : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // The real bundled song and LRC are committed directly under
    // app/src/main/res/raw. No copy/generation task is used, so resource
    // merging sees the same files in local and GitHub Actions builds.
    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
