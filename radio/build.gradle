plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maru.radio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maru.radio.catalog'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Deliberately no libraries: Android SDK only. No OCR, AI, WebView, or recording.
