plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maru.radio'
    compileSdk 36

    defaultConfig {
        // Stable Play Console application ID: do not change it after publishing.
        applicationId 'com.maru.radio.ahwan'
        minSdk 26
        // Google Play requires API 36+ for new phone app releases after Aug 31 2026.
        targetSdk 36
        versionCode 28
        versionName '1.9.14-ahwan-mic-voice-clips'
    }

    // Store upload credentials must be supplied by the repository owner through
    // GitHub Actions Secrets. Never commit keystore files or passwords.
    // When unavailable, debug key is used strictly for CI compilation tests;
    // that CI build must NEVER be submitted to Google Play as a release.
    signingConfigs {
        if (System.getenv("MARU_UPLOAD_KEYSTORE_PATH")
                && System.getenv("MARU_UPLOAD_STORE_PASSWORD")
                && System.getenv("MARU_UPLOAD_KEY_ALIAS")
                && System.getenv("MARU_UPLOAD_KEY_PASSWORD")) {
            releaseUpload {
                storeFile file(System.getenv("MARU_UPLOAD_KEYSTORE_PATH"))
                storePassword System.getenv("MARU_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("MARU_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("MARU_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.findByName("releaseUpload") != null
                    ? signingConfigs.releaseUpload : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Standard Android SDK only; no additional third-party SDK or hidden control.

// Apache-2.0 RootEncoder: video-free microphone capture, static artwork + decoded
// file audio are sent through RTMP independently of the Android speaker level.
// Requires an owner-provided authorized BIGO OBS streaming endpoint and key.
dependencies {
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
}
