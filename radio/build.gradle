plugins {
    id 'com.android.application'
}

// An Android app can update an installed copy only when the package ID and
// signing certificate match. The user's existing private key must be provided
// via GitHub Actions secrets; it is NEVER committed to this public repository.
def matchingKeystore = System.getenv('MARU_RADIO_KEYSTORE_PATH')

android {
    signingConfigs {
        if (matchingKeystore) {
            installedAppUpdate {
                storeFile file(matchingKeystore)
                storePassword System.getenv('MARU_RADIO_STORE_PASSWORD')
                keyAlias System.getenv('MARU_RADIO_KEY_ALIAS')
                keyPassword System.getenv('MARU_RADIO_KEY_PASSWORD')
            }
        }
    }
    namespace 'com.maru.radio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.maru.radio.safev16'
        minSdk 26
        targetSdk 35
        versionCode 43
        versionName '1.9.29-safe-studio'
    }

    buildTypes {
        release {
            // CI preview still uses a disposable debug cert and CANNOT be
            // represented as a compatible in-place update.
            // Manual, protected update workflow supplies original keystore.
            signingConfig matchingKeystore ? signingConfigs.installedAppUpdate : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Deliberately no libraries: Android SDK only. No OCR, AI, WebView, or recording.
