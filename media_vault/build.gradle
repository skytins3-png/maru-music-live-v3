    applicationId 'com.maru.media.privatevault.uiqa20261108'
    minSdk 26
    targetSdk 35
    versionCode 6
    versionName '1.1.2-galaxy-layout-qa'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
