plugins {
    id 'com.android.application'
}
android {
    namespace 'com.maru.ahwanvoice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.maru.ahwanvoice.studio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-preview'
    }
    buildTypes {
        release {
            // Preview installer only; production requires a persistent signing key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
