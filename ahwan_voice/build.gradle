plugins {
    id 'com.android.application'
}
android {
    namespace 'com.maru.ahwanvoice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.maru.ahwanvoice.realclips'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-real-voice-only'
    }
    buildTypes {
        release {
            // Preview installer only; production requires a persistent signing key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
