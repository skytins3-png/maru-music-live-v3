plugins {
  id 'com.android.application'
  id 'com.chaquo.python'
}
android {
  namespace 'com.maru.pyscore'
  compileSdk 35
  defaultConfig {
    applicationId 'com.maru.pyscore'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '0.1'
    ndk { abiFilters "arm64-v8a" }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
chaquopy {
  defaultConfig {
    version = "3.11"
    pip { install "numpy==1.26.2" }
  }
}
