name: Build MARU ONE standalone installer

on:
  push:
    branches:
      - feat/standalone-maru-one-install-20261031
      - feat/maru-one-my-voice-enhancer-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Verify safe standalone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate project, privacy and Android unit tests
        run: |
          python3 scripts/check_maru_clean.py
          python3 scripts/check_voice_policy.py
          python3 scripts/check_required_media.py
          gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble dedicated MARU ONE APK
        run: gradle --no-daemon :app:assembleRelease -PmaruStandalone=1
      - name: Verify standalone package, size, signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/maru-one-badging.txt
          grep -F "name='com.maru.musiclive.one' versionCode='3043' versionName='3.2.24'" /tmp/maru-one-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/maru-one-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|RECEIVE_SMS|android.accessibilityservice.AccessibilityService' /tmp/maru-one-manifest.txt; then
            echo "::error::Unexpected sensitive permission or accessibility service"
            exit 1
          fi
          cp "$APK" MARU-ONE-SUNO-AHWAN-V3.2.24.apk
          sha256sum MARU-ONE-SUNO-AHWAN-V3.2.24.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > SIGNER.txt
          echo "Standalone APK validated. Installed original MARU remains untouched."
      - name: Upload verified standalone install file
        uses: actions/upload-artifact@v4
        with:
          name: MARU-ONE-SUNO-AHWAN-INSTALL
          if-no-files-found: error
          path: |
            MARU-ONE-SUNO-AHWAN-V3.2.24.apk
            SHA256SUMS.txt
            SIGNER.txt
