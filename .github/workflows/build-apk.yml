name: Build MARU MUSIC LIVE V3.2.19 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 반드시 모든 project-check보다 먼저 실행한다.
      - name: Remove obsolete repository leftovers before every check
        shell: bash
        run: |
          set -euo pipefail

          # GitHub 웹 업로드가 기존 추적 파일을 삭제하지 않는 경우를 방어한다.
          # 모든 저장소 루트 Java 잔재를 제거한다. 정상 Java는 app/ 또는 tools/에만 있다.
          find . -maxdepth 1 -type f -name '*.java' -print -delete
          rm -rf build app/build .gradle

          # 구형 음성 리소스와 알려진 저장소 잔재를 제거한다. V3.2.19에서는 접근성 서비스/민감 권한을 포함하지 않는다.
          rm -f app/src/main/res/raw/default_male_greeting*.mp3
          rm -f app/src/main/java/com/maru/musiclive/BigoAccessibilityService.java
          rm -f app/src/main/java/com/maru/musiclive/AccessibilityEventRelay.java
          rm -f app/src/main/java/com/maru/musiclive/AutoHostAccessibilityService.java
          rm -f app/src/main/java/com/maru/musiclive/GreetingAudioResolver.java
          rm -f app/src/main/java/com/maru/musiclive/NodeTextCollector.java
          rm -rf required_media scripts/media_payload
          rm -f scripts/restore_required_media.py

          # 이 단계가 실패하면 뒤의 검사를 시작하지 않는다.
          test -z "$(find . -maxdepth 1 -type f -name '*.java' -print -quit)"
          test ! -e build
          test ! -e app/build
          test ! -e .gradle
          test -z "$(find app/src/main/res/raw -maxdepth 1 -type f -name 'default_male_greeting*.mp3' -print -quit)"
          test ! -e required_media
          test ! -e scripts/media_payload
          test ! -e scripts/restore_required_media.py
          test ! -e app/src/main/java/com/maru/musiclive/BigoAccessibilityService.java
          test ! -e app/src/main/java/com/maru/musiclive/AccessibilityEventRelay.java
          test ! -e app/src/main/java/com/maru/musiclive/AutoHostAccessibilityService.java
          test ! -e app/src/main/java/com/maru/musiclive/GreetingAudioResolver.java
          test ! -e app/src/main/java/com/maru/musiclive/NodeTextCollector.java

          echo "---- repository root after pre-check cleanup ----"
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify committed raw media before tests
        run: |
          python3 scripts/check_required_media.py
          echo "---- committed app/src/main/res/raw ----"
          find app/src/main/res/raw -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          sha256sum app/src/main/res/raw/actual_music.mp3 app/src/main/res/raw/actual_lyrics.lrc

      - name: Source separation and version consistency check
        run: python3 scripts/check_maru_clean.py

      - name: Five-language device TTS policy check
        run: python3 scripts/check_voice_policy.py

      - name: Repeat source integrity validation 1,000 times
        run: python3 scripts/run_source_integrity_1000.py

      - name: Java import check
        run: python3 scripts/check_java_imports.py

      - name: Built APK text-matching regression test
        run: python3 scripts/test_built_apk_text_matching.py

      - name: V3.1.6 playback and control regression check
        run: python3 scripts/check_playback_ui_regression.py

      - name: Home player image and controls 1000-cycle check
        run: python3 scripts/test_home_player_ui_1000.py

      - name: Core and stress self-tests
        run: bash scripts/run_core_self_test.sh

      - name: Auto-reply join contract compile test
        run: bash scripts/run_auto_reply_policy_checked_compile.sh

      - name: Adaptive AI checked-exception compile test
        run: bash scripts/run_adaptive_store_checked_compile.sh

      - name: Song title resolver checked-exception compile test
        run: bash scripts/run_song_title_resolver_checked_compile.sh

      - name: Playback and intermission TTS compile test
        run: bash scripts/run_playback_tts_checked_compile.sh

      - name: Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      # JVM 셀프 테스트가 만든 루트 build/만 정리한다.
      - name: Post-test cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          test -z "$(find . -maxdepth 1 -type f -name '*.java' -print -quit)"

      - name: Verify raw media immediately before assembly
        run: python3 scripts/check_required_media.py

      - name: Build installable debug and release APKs
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug :app:assembleRelease

      - name: Verify merged APK manifests contain no sensitive accessibility service
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml > /tmp/maru-manifest-tree.txt
            if grep -E 'BIND_ACCESSIBILITY_SERVICE|BigoBroadcastNavigatorService|android.accessibilityservice.AccessibilityService|READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE' /tmp/maru-manifest-tree.txt; then
              echo "BLOCKED: built APK still declares sensitive accessibility/SMS/notification access"
              exit 1
            fi
            echo "SAFE-MANIFEST: no AccessibilityService or sensitive permissions in $apk"
          done

      - name: Verify, sign-check, and rename APKs
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk
          cp app/build/outputs/apk/release/app-release.apk MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk

          # Never ship the four-ABI 51MB build to Galaxy ARM64 users again.
          for apk in MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk; do
            unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libmlkit_google_ocr_pipeline.so
          SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]]
          echo "$SIGNER" > MARU-SIGNER-SHA256.txt
          echo "RELEASE-SIGNER-SHA256: $SIGNER"

          # Reject a renamed old APK: inspect the embedded manifest of the actual built outputs.
          for apk in MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/maru-badging.txt
            grep -F "name='com.maru.musiclive.ocr' versionCode='3038' versionName='3.2.19" /tmp/maru-badging.txt
            echo "VERSION-VERIFIED: $apk has build code 3038 and version 3.2.19"
          done

      - name: Inspect actual built APK contents
        run: |
          echo "---- Debug APK raw resources ----"
          unzip -l MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk | grep -E 'res/raw|actual_music|actual_lyrics' || true
          echo "---- Release APK raw resources ----"
          unzip -l MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk | grep -E 'res/raw|actual_music|actual_lyrics' || true
          python3 scripts/check_built_apk.py MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk
          python3 scripts/check_built_apk.py MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: MARU-MUSIC-LIVE-V3.2.19-APK
          path: |
            MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk
            MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk
            MARU-SIGNER-SHA256.txt
          if-no-files-found: error

  publish:
    name: Publish verified update APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch only the verified build APKs
        uses: actions/download-artifact@v4
        with:
          name: MARU-MUSIC-LIVE-V3.2.19-APK

      - name: Publish stable GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk
          unzip -t MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk > /dev/null
          cp MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk MARU-RADIO.apk
          sha256sum MARU-RADIO.apk > SHA256SUMS.txt
          SIGNER=$(cat MARU-SIGNER-SHA256.txt)
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]]
          printf 'MARU RADIO V3.2.19 검증 배포판. Android 설치 승인은 사용자 선택입니다.\n\nSIGNER_SHA256=%s\n' "$SIGNER" > RELEASE_NOTES.txt
          if gh release view "v3.2.19" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v3.2.19 already exists; do not overwrite its APK."
            exit 0
          fi
          gh release create "v3.2.19" MARU-RADIO.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MARU RADIO v3.2.19 자동 업데이트 확인" \
            --notes-file RELEASE_NOTES.txt \
            --latest

            if unzip -Z1 "$apk" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'; then
              echo "::error::Unexpected x86 or 32-bit OCR shared libraries in ARM64 installer"
              exit 1
            fi
            size=$(stat -c%s "$apk")
            echo "ARM64-SIZE-VERIFIED: $apk bytes=$size"
            if [ "$size" -gt 29360128 ]; then
              echo "::error::APK is too large for the verified ARM64-only package"
              exit 1
            fi
          done
          SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]]
          echo "$SIGNER" > MARU-SIGNER-SHA256.txt
          echo "RELEASE-SIGNER-SHA256: $SIGNER"

          # Reject a renamed old APK: inspect the embedded manifest of the actual built outputs.
          for apk in MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/maru-badging.txt
            grep -F "name='com.maru.musiclive.ocr' versionCode='3038' versionName='3.2.19" /tmp/maru-badging.txt
            echo "VERSION-VERIFIED: $apk has build code 3038 and version 3.2.19"
          done

      - name: Inspect actual built APK contents
        run: |
          echo "---- Debug APK raw resources ----"
          unzip -l MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk | grep -E 'res/raw|actual_music|actual_lyrics' || true
          echo "---- Release APK raw resources ----"
          unzip -l MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk | grep -E 'res/raw|actual_music|actual_lyrics' || true
          python3 scripts/check_built_apk.py MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk
          python3 scripts/check_built_apk.py MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: MARU-MUSIC-LIVE-V3.2.19-APK
          path: |
            MARU-MUSIC-LIVE-V3.2.19-DEBUG.apk
            MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk
            MARU-SIGNER-SHA256.txt
          if-no-files-found: error

  publish:
    name: Publish verified update APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch only the verified build APKs
        uses: actions/download-artifact@v4
        with:
          name: MARU-MUSIC-LIVE-V3.2.19-APK

      - name: Publish stable GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk
          unzip -t MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk > /dev/null
          cp MARU-MUSIC-LIVE-V3.2.19-MUSIC-RELEASE.apk MARU-RADIO.apk
          sha256sum MARU-RADIO.apk > SHA256SUMS.txt
          SIGNER=$(cat MARU-SIGNER-SHA256.txt)
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]]
          printf 'MARU RADIO V3.2.19 검증 배포판. Android 설치 승인은 사용자 선택입니다.\n\nSIGNER_SHA256=%s\n' "$SIGNER" > RELEASE_NOTES.txt
          if gh release view "v3.2.19" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v3.2.19 already exists; do not overwrite its APK."
            exit 0
          fi
          gh release create "v3.2.19" MARU-RADIO.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MARU RADIO v3.2.19 자동 업데이트 확인" \
            --notes-file RELEASE_NOTES.txt \
            --latest
