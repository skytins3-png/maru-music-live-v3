name: Package MARU MEDIA QA installation candidate
on:
  push:
    branches: [maru-reference-ui-20261108]
    paths:
      - 'media_vault/**'
      - 'settings.gradle'
      - '.github/workflows/build-media-qa-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and compilation
        run: gradle --no-daemon :media_vault:testDebugUnitTest :media_vault:assembleDebug :media_vault:assembleDebugAndroidTest
      - name: Verify package, architecture, signature and permissions
        run: |
          set -euo pipefail
          APK=media_vault/build/outputs/apk/debug/media_vault-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee package-details.txt
          grep -F "package: name='com.maru.media.privatevault.v20261108'" package-details.txt
          grep -F "application-label:'MARU RADIO'" package-details.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > permissions.txt
          ! grep -E 'RECORD_AUDIO|BIND_ACCESSIBILITY_SERVICE|READ_SMS|MANAGE_EXTERNAL_STORAGE' permissions.txt
          mkdir -p output
          cp "$APK" output/MARU-MEDIA-QA-ANDROID-TESTONLY.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
          cp package-details.txt permissions.txt output/
      - uses: actions/upload-artifact@v4
        with:
          name: MARU-MEDIA-QA-APK-DEBUG
          if-no-files-found: error
          path: output/*
