name: MARU RADIO matching-signer update (original key required)

on:
  workflow_dispatch:
    inputs:
      installed_certificate_sha256:
        description: "Installed app APK signer certificate SHA-256 (hex; no private data)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  update:
    # No untrusted PR code gets release keys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require original installed signer and prepare short-lived keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MARU_RADIO_ORIGINAL_KEYSTORE_BASE64 }}
          MARU_RADIO_STORE_PASSWORD: ${{ secrets.MARU_RADIO_ORIGINAL_STORE_PASSWORD }}
          MARU_RADIO_KEY_ALIAS: ${{ secrets.MARU_RADIO_ORIGINAL_KEY_ALIAS }}
          MARU_RADIO_KEY_PASSWORD: ${{ secrets.MARU_RADIO_ORIGINAL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$MARU_RADIO_STORE_PASSWORD" ||
                -z "$MARU_RADIO_KEY_ALIAS" || -z "$MARU_RADIO_KEY_PASSWORD" ]]; then
            echo "::error::Original app signing key is not configured. This workflow cannot update a previously installed app."
            exit 1
          fi
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maru-original-signing.jks"
          chmod 600 "$RUNNER_TEMP/maru-original-signing.jks"
          echo "MARU_RADIO_KEYSTORE_PATH=$RUNNER_TEMP/maru-original-signing.jks" >> "$GITHUB_ENV"

      - name: Validate existing app contract
        run: python3 scripts/test_radio_contract.py

      - name: Assemble original-signer radio update
        env:
          MARU_RADIO_STORE_PASSWORD: ${{ secrets.MARU_RADIO_ORIGINAL_STORE_PASSWORD }}
          MARU_RADIO_KEY_ALIAS: ${{ secrets.MARU_RADIO_ORIGINAL_KEY_ALIAS }}
          MARU_RADIO_KEY_PASSWORD: ${{ secrets.MARU_RADIO_ORIGINAL_KEY_PASSWORD }}
        run: gradle --no-daemon :radio:assembleRelease

      - name: Fail closed on any signing identity mismatch
        env:
          EXPECTED: ${{ inputs.installed_certificate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="radio/build/outputs/apk/release/radio-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose "$APK"
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf "%s" "$EXPECTED" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Certificate differs from installed app. Do NOT uninstall or install this APK as an update."
            exit 1
          fi
          # The previous app is not touched. Users still need to check versionCode
          # and the same package name on their actual installed app.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.maru.radio.safev16'"
          cp "$APK" MARU-RADIO-V1.6.2-SAME-SIGNER-UPDATE.apk
          echo "Same signing certificate confirmed against user-provided fingerprint."

      - uses: actions/upload-artifact@v4
        with:
          name: MARU-RADIO-V1.6.2-SAME-SIGNER-UPDATE
          path: MARU-RADIO-V1.6.2-SAME-SIGNER-UPDATE.apk
          if-no-files-found: error

      - name: Remove decrypted original signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/maru-original-signing.jks"
