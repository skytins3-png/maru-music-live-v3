name: Real Android emulator - Ahwan microphone and MARU clip bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "ahwan_voice/**"
      - "app/**"
      - "scripts/test_ahwan_realvoice_emulator.py"
      - ".github/workflows/test-ahwan-android-emulator.yml"
  push:
    branches: [main]
    paths:
      - "ahwan_voice/**"
      - "app/**"
      - "scripts/test_ahwan_realvoice_emulator.py"
      - ".github/workflows/test-ahwan-android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK build prerequisites
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests and emulator-only x86_64 APK build
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            :ahwan_voice:assembleDebug :app:assembleDebug \
            -PmaruClipOnly=1 -PmaruEmulatorSmoke=1
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 virtual-device end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/test_ahwan_realvoice_emulator.py
      - name: Upload test screenshots, logs and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ahwan-Android15-Emulator-Test-Report
          path: test-results/ahwan-emulator/
          if-no-files-found: warn
