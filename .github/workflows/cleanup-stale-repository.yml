name: Permanently remove stale repository files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove tracked leftovers
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.java' -print -delete
          rm -rf build app/build .gradle
          rm -f app/src/main/res/raw/default_male_greeting*.mp3
          rm -f app/src/main/java/com/maru/musiclive/BigoAccessibilityService.java
          rm -f app/src/main/java/com/maru/musiclive/AccessibilityEventRelay.java
          rm -f app/src/main/java/com/maru/musiclive/AutoHostAccessibilityService.java
          rm -f app/src/main/java/com/maru/musiclive/GreetingAudioResolver.java
          rm -f app/src/main/java/com/maru/musiclive/NodeTextCollector.java
          rm -rf required_media scripts/media_payload
          rm -f scripts/restore_required_media.py

          test -z "$(find . -maxdepth 1 -type f -name '*.java' -print -quit)"
          test ! -e build
          test ! -e app/build
          test ! -e .gradle
          test -z "$(find app/src/main/res/raw -maxdepth 1 -type f -name 'default_male_greeting*.mp3' -print -quit)"

      - name: Commit permanent deletion when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No stale tracked files remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: permanently remove stale root Java and build artifacts [skip ci]"
          git push origin HEAD:main
