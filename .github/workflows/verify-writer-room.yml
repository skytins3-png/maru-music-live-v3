name: Verify separate MARU five-writer department
on:
  push:
    branches: [editorial-writers-separated-20261108]
    paths:
      - 'app/src/main/java/com/maru/musiclive/WriterRoom*.java'
      - 'app/src/test/java/com/maru/musiclive/WriterRoomTest.java'
      - '.github/workflows/verify-writer-room.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/maru/musiclive/WriterRoom*.java'
      - 'app/src/test/java/com/maru/musiclive/WriterRoomTest.java'
      - '.github/workflows/verify-writer-room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.maru.musiclive.WriterRoomTest'
