name: AHwan Live Studio adaptive talk and emulator tests

on:
  push:
    branches: ["feat/ahwan-adaptive-talk-producer-20261107"]
  pull_request:
    branches: [main]
    paths:
      - "ahwan_voice/**"
      - ".github/workflows/ahwan-live-studio-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests and actual Android APK builds
        run: |
          set -euo pipefail
          gradle --no-daemon :ahwan_voice:testDebugUnitTest :ahwan_voice:assembleRelease :ahwan_voice:assembleDebug
      - name: Reject TTS usage in show engine
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'import[[:space:]]+android[.]speech[.]tts|new[[:space:]]+TextToSpeech|TextToSpeech[.]|tts[.]speak' ahwan_voice/src/main/java/com/maru/ahwanvoice/*.java
      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: "Android 15 virtual phone - six audio cues, empty queue, emergency stop"
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: gradle --no-daemon :ahwan_voice:connectedDebugAndroidTest
      - name: Validate final fresh-install APK and signing
        shell: bash
        run: |
          set -euo pipefail
          apk="ahwan_voice/build/outputs/apk/release/ahwan_voice-release.apk"
          unzip -t "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.maru.ahwanvoice.show.v20261107'"
          mkdir -p verified
          cp "$apk" verified/AHWAN-LIVE-STUDIO-V0.4-TESTED.apk
          (cd verified && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish installer only after virtual phone tests pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AHWAN-LIVE-STUDIO-V0.4-ANDROID15-VERIFIED
          if-no-files-found: error
          path: verified/*
      - name: Save virtual phone test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AHWAN-LIVE-STUDIO-EMULATOR-TEST-RESULTS
          if-no-files-found: warn
          path: |
            ahwan_voice/build/reports/**
            ahwan_voice/build/outputs/androidTest-results/**
            ahwan_voice/build/outputs/logs/**
