name: MARU Python Score Android Emulator Smoke Test
on:
  push:
    branches: [maru-python-kivy-score-apk-20261109]
    paths:
      - 'python_score_chaquopy/**'
      - '.github/workflows/test-maru-chaquopy-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile x86_64 emulator APK with Python runtime
        working-directory: python_score_chaquopy
        run: gradle --no-daemon :app:assembleDebug -PemulatorBuild=1
      - name: Enable KVM
        run: |
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot app and inspect Python errors
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          script: |
            set -e
            adb install -r python_score_chaquopy/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.maru.pyscore/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep 'com.maru.pyscore'
            adb logcat -d -v time > maru-emulator-log.txt
            ! grep 'FATAL EXCEPTION' maru-emulator-log.txt
            adb exec-out screencap -p > maru-emulator-screen.png
            test -s maru-emulator-screen.png
            python3 -c "from pathlib import Path; p=Path('maru-emulator-screen.png'); assert p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])); print('Android app startup and PNG screen confirmed')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MARU-PYTHON-Score-Emulator-QA
          path: |
            maru-emulator-log.txt
            maru-emulator-screen.png
            python_score_chaquopy/app/build/outputs/apk/debug/*.apk
          retention-days: 10
          if-no-files-found: warn
