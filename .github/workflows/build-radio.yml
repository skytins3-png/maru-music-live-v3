name: MARU RADIO V1.9.10 independent phone audio-to-RTMP build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/maru-radio-clean-20261015
      - fix/radio-no-fixed-hour-start-end-v17-20261015
      - experiment/mobile-audio-live-e2e-v18-20261016
      - feat/maru-ai-radio-announcer-v19-20261016
      - release/ahwan-v194-accessibility-play-20261016
      - fix/ahwan-v195-owner-recorded-opening-20261016
      - fix/ahwan-v196-constant-volume-20261016
      - feat/ahwan-v197-bigo-live-comment-and-audio-validation-20261016
      - feat/maru-v198-independent-rtmp-audio-20261017
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check clean original-audio app contract
        run: python3 scripts/test_radio_contract.py

      - name: Test next-day and overnight clock calculations (plain Java)
        run: |
          mkdir -p /tmp/radio-clock-tests
          javac -d /tmp/radio-clock-tests \
            radio/src/main/java/com/maru/radio/RadioClock.java \
            scripts/RadioClockSelfTest.java
          java -cp /tmp/radio-clock-tests com.maru.radio.RadioClockSelfTest

      - name: Test BIGO mock screenshot labels (never starts an actual LIVE)
        run: |
          mkdir -p /tmp/maru-ui-policy
          javac -d /tmp/maru-ui-policy \
            radio/src/main/java/com/maru/radio/BigoAutomationPolicy.java \
            radio/src/main/java/com/maru/radio/BigoMicLayoutPolicy.java \
            scripts/BigoAutomationPolicySelfTest.java
          java -cp /tmp/maru-ui-policy com.maru.radio.BigoAutomationPolicySelfTest

      - name: Test DJ dialogue and catalog song matching (offline JVM)
        run: |
          mkdir -p /tmp/maru-dj-test
          javac -d /tmp/maru-dj-test \
            radio/src/main/java/com/maru/radio/RadioDjBrain.java \
            scripts/RadioDjBrainSelfTest.java
          java -cp /tmp/maru-dj-test com.maru.radio.RadioDjBrainSelfTest

      - name: Test Ahwan concise per-event language policy (plain JVM)
        run: |
          mkdir -p /tmp/maru-dj-language
          javac -d /tmp/maru-dj-language \
            radio/src/main/java/com/maru/radio/RadioDjLanguagePolicy.java \
            scripts/RadioDjLanguagePolicySelfTest.java
          java -cp /tmp/maru-dj-language com.maru.radio.RadioDjLanguagePolicySelfTest

      - name: Test dynamic range compressor and limiter policies (JVM)
        run: |
          mkdir -p /tmp/maru-volume-tests
          javac -d /tmp/maru-volume-tests \
            radio/src/main/java/com/maru/radio/RadioLevelPolicy.java \
            scripts/RadioLevelPolicySelfTest.java
          java -cp /tmp/maru-volume-tests com.maru.radio.RadioLevelPolicySelfTest

      - name: Test BIGO live chat privacy and five-language fixed responses (JVM)
        run: |
          mkdir -p /tmp/maru-chat-tests
          javac -d /tmp/maru-chat-tests \
            radio/src/main/java/com/maru/radio/RadioDjLanguagePolicy.java \
            radio/src/main/java/com/maru/radio/BigoChatRule.java \
            scripts/BigoChatRuleSelfTest.java
          java -cp /tmp/maru-chat-tests com.maru.radio.BigoChatRuleSelfTest

      - name: Test direct RTMP PCM music plus Ahwan TTS ducking and digital peak bounds
        run: |
          mkdir -p /tmp/maru-rtmp-mix-tests
          javac -d /tmp/maru-rtmp-mix-tests \
            radio/src/main/java/com/maru/radio/RadioRtmpPcmVoiceMixer.java \
            scripts/RadioRtmpPcmVoiceMixerSelfTest.java
          java -cp /tmp/maru-rtmp-mix-tests com.maru.radio.RadioRtmpPcmVoiceMixerSelfTest

      - name: Test RTMP network loudness leveling and stereo peak bound (pure JVM)
        run: |
          mkdir -p /tmp/maru-rtmp-leveler-tests
          javac -d /tmp/maru-rtmp-leveler-tests \
            radio/src/main/java/com/maru/radio/RadioRtmpPcmLeveler.java \
            scripts/RadioRtmpPcmLevelerSelfTest.java
          java -cp /tmp/maru-rtmp-leveler-tests com.maru.radio.RadioRtmpPcmLevelerSelfTest

      - name: Build only the new radio module
        run: gradle --no-daemon :radio:lintDebug :radio:assembleDebug :radio:assembleRelease

      - name: Bundle Android App Bundle for structural validation only
        run: gradle --no-daemon :radio:bundleRelease

      - name: Verify correct app and signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in radio/build/outputs/apk/debug/radio-debug.apk radio/build/outputs/apk/release/radio-release.apk; do
            "$SIGNER" verify --verbose "$apk"
            "$AAPT" dump badging "$apk" > /tmp/radio-badging.txt
            grep "package: name='com.maru.radio.ahwan'" /tmp/radio-badging.txt
            grep "application-label:'MARU RADIO V1.9.10 전체 기능'" /tmp/radio-badging.txt
            ! grep -Eq "RECORD_AUDIO|READ_MEDIA|MANAGE_EXTERNAL_STORAGE|BIND_ACCESSIBILITY_SERVICE" /tmp/radio-badging.txt
          done
          cp radio/build/outputs/apk/debug/radio-debug.apk MARU-RADIO-V1.9.10-RTMP-CI-ONLY-INSTALL.apk
          ls -lh MARU-RADIO-V1.9.10-RTMP-CI-ONLY-INSTALL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MARU-RADIO-V1.9.10-RTMP-CI-ONLY
          path: MARU-RADIO-V1.9.10-RTMP-CI-ONLY-INSTALL.apk
          if-no-files-found: error
