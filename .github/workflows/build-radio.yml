name: MARU RADIO V1.9.26 safe schedule and studio CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/radio-safe-schedule-studio
      - feat/maru-radio-clean-20261015
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check clean original-audio app contract
        run: python3 scripts/test_radio_contract.py
      - name: Test fictional radio host scripts
        run: |
          mkdir -p build/radio-script-tests
          javac -d build/radio-script-tests radio/src/main/java/com/maru/radio/RadioShowLines.java scripts/RadioShowLinesTest.java
          java -cp build/radio-script-tests RadioShowLinesTest

      - name: Check second-device BIGO listener confirmation policy
        run: |
          mkdir -p build/bigo-listener-tests
          javac -d build/bigo-listener-tests radio/src/main/java/com/maru/radio/BigoReceptionChecklist.java scripts/BigoReceptionChecklistTest.java
          java -cp build/bigo-listener-tests BigoReceptionChecklistTest

      - name: Test clock scheduling
        run: |
          mkdir -p build/clock-tests
          javac -d build/clock-tests radio/src/main/java/com/maru/radio/RadioClock.java scripts/RadioClockSelfTest.java
          java -cp build/clock-tests com.maru.radio.RadioClockSelfTest

      - name: Test ten-thousand-track playlists and dynamic announcements
        run: |
          mkdir -p build/catalog-tests
          javac -d build/catalog-tests radio/src/main/java/com/maru/radio/CatalogOrder.java radio/src/main/java/com/maru/radio/RadioShowLines.java scripts/CatalogOrderTest.java
          java -cp build/catalog-tests CatalogOrderTest

      - name: Build only the new radio module
        run: gradle --no-daemon :radio:lintDebug :radio:assembleDebug :radio:assembleRelease

      - name: Verify correct app and signing
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in radio/build/outputs/apk/debug/radio-debug.apk radio/build/outputs/apk/release/radio-release.apk; do
            "$SIGNER" verify --verbose "$apk"
            "$AAPT" dump badging "$apk" > /tmp/radio-badging.txt
            grep "package: name='com.maru.radio.safev16'" /tmp/radio-badging.txt
            grep "application-label:'MARU RADIO 안전형'" /tmp/radio-badging.txt
            ! grep -Eq "RECORD_AUDIO|READ_MEDIA|MANAGE_EXTERNAL_STORAGE|BIND_ACCESSIBILITY_SERVICE" /tmp/radio-badging.txt
          done
          cp radio/build/outputs/apk/debug/radio-debug.apk MARU-RADIO-V1.9.26-SAFE-STUDIO-CI.apk
          ls -lh MARU-RADIO-V1.9.26-SAFE-STUDIO-CI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MARU-RADIO-V1.9.26-SAFE-STUDIO-CI
          path: MARU-RADIO-V1.9.26-SAFE-STUDIO-CI.apk
          if-no-files-found: error
