name: MARU ONE verified same-app updates

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/maru-one-stable-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and signing tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assign increasing same-app version for this workflow run
        shell: bash
        run: |
          echo "MARU_VERSION=3.2.$((24 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "MARU_CODE=$((3043 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Require PERSISTENT original signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MARU_ONE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MARU_ONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARU_ONE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARU_ONE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Original MARU ONE signing key secrets missing. Never replace them with a new debug key. Existing app data must be preserved."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maru-one-release.keystore"
          chmod 600 "$RUNNER_TEMP/maru-one-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/maru-one-release.keystore" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
      - name: Unit tests and APK assembly using pinned identity
        env:
          MARU_ONE_KEYSTORE_PATH: ${{ runner.temp }}/maru-one-release.keystore
          MARU_ONE_KEYSTORE_PASSWORD: ${{ secrets.MARU_ONE_KEYSTORE_PASSWORD }}
          MARU_ONE_KEY_ALIAS: ${{ secrets.MARU_ONE_KEY_ALIAS }}
          MARU_ONE_KEY_PASSWORD: ${{ secrets.MARU_ONE_KEY_PASSWORD }}
        run: |
          python3 scripts/check_maru_clean.py
          python3 scripts/check_voice_policy.py
          python3 scripts/check_required_media.py
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease -PmaruStandalone=1 \
            -PmaruOneVersionCode="$MARU_CODE" -PmaruOneVersionName="$MARU_VERSION"
      - name: Verify old installed cert, version, package and APK bytes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          # Pinned from the already-distributed v3.2.24-one APK.
          # Without THIS signing key, Android cannot update that app in place.
          EXPECTED=edf00be97de595d3f204aa48d4a56a61b3a9567292fc208706687660126fdb1e
          grep -F "$EXPECTED" signer.txt > /dev/null || {
            echo "::error::Signer mismatch with installed v3.2.24-one. Refusing to publish an uninstall/reinstall trap."
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.maru.musiclive.one' versionCode='$MARU_CODE' versionName='$MARU_VERSION'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          if grep -Ei 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|RECEIVE_SMS' manifest.txt; then
            echo "::error::Unexpected sensitive permission"
            exit 1
          fi
          cp "$APK" "MARU-ONE-v$MARU_VERSION.apk"
          sha256sum "MARU-ONE-v$MARU_VERSION.apk" > SHA256SUMS.txt
          {
            echo "PACKAGE=com.maru.musiclive.one"
            echo "VERSION_CODE=$MARU_CODE"
            echo "SIGNER_SHA256=$EXPECTED"
            echo "APK_SHA256=$(cut -d' ' -f1 SHA256SUMS.txt)"
            echo
            echo "MARU ONE automatic update menu; Android requires user installation approval."
            echo "The installed music library and preferences are preserved by a same-signer update."
            echo "BIGO live listener output requires a separate physical device test."
          } > RELEASE-NOTES.txt
      - name: Publish only the same-certificate verified installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$MARU_VERSION-one"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release already exists: no overwrite of signed APK."
            exit 0
          fi
          gh release create "$TAG" "MARU-ONE-v$MARU_VERSION.apk" SHA256SUMS.txt signer.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MARU ONE $MARU_VERSION Verified Same-App Update" \
            --notes-file RELEASE-NOTES.txt --prerelease
