name: MARU eight-screen real device install and UI verification
on:
  push:
    branches: [maru-eight-screen-20261108]
    paths:
      - 'media_vault/**'
      - '.github/workflows/test-maru-eight-screens.yml'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-virtual-device:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: JavaScript syntax check
        run: node --check media_vault/src/main/assets/studio/app.js
      - name: Unit tests and APK compile
        run: gradle --no-daemon :media_vault:testDebugUnitTest :media_vault:assembleDebug :media_vault:assembleDebugAndroidTest
      - name: Enable KVM hardware acceleration
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM not exposed; Android device emulator may be slow"
          fi
      - name: Device emulator test, menu tap, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4500M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          script: |
            set -e
            adb install -r media_vault/build/outputs/apk/debug/media_vault-debug.apk
            adb shell am start -W -n com.maru.media.privatevault.v20261108/com.maru.media.ShowcaseActivity
            sleep 3
            mkdir -p eight-screen-screenshots
            adb exec-out screencap -p > eight-screen-screenshots/home.png
            gradle --no-daemon :media_vault:connectedDebugAndroidTest
            for name in 01-home 02-songs 03-song-detail 04-upload 05-downloads 06-story-compose 07-stories 08-story-detail 09-profile; do adb exec-out run-as com.maru.media.privatevault.v20261108 cat "files/eight-screens/$name.png" > "eight-screen-screenshots/$name.png" && test -s "eight-screen-screenshots/$name.png" || exit 1; done
            python3 -c 'from pathlib import Path; p=list(Path("eight-screen-screenshots").glob("*.png")); assert len(p)>=9, len(p); assert all(x.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for x in p); print("Validated",len(p),"Android screenshots")'
      - name: Signed APK and permission checks
        run: |
          set -euo pipefail
          APK=media_vault/build/outputs/apk/debug/media_vault-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee package-details.txt
          grep -F "com.maru.media.privatevault.v20261108" package-details.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          ! grep -E 'RECORD_AUDIO|BIND_ACCESSIBILITY_SERVICE|READ_SMS|MANAGE_EXTERNAL_STORAGE' permissions.txt
          mkdir -p deliverables
          cp "$APK" deliverables/MARU-RADIO-EIGHT-SCREENS-V1.1.0.apk
          (cd deliverables && sha256sum *.apk > SHA256SUMS.txt)
          cp package-details.txt permissions.txt deliverables/
      - name: Upload APK and emulator screenshots/reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARU-EIGHT-SCREENS-APK-AND-DEVICE-QA
          if-no-files-found: warn
          path: |
            deliverables/**
            eight-screen-screenshots/**
            media_vault/build/reports/**
            media_vault/build/outputs/androidTest-results/**
            media_vault/src/main/assets/studio/**
            media_vault/src/main/assets/reference_home.webp
